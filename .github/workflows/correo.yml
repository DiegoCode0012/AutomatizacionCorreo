name: Enviar Correo Diario

on:
  schedule:
    # Se ejecuta todos los días a las 8:00 AM UTC
    - cron: '0 8 * * *' 
  workflow_dispatch: # Permite probar el script de forma manual desde la web de GitHub

jobs:
  enviar_correo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de envío
        env:
          MAIL_PASS: ${{ secrets.GMAIL_PASSWORD }}
        run: python enviar_correo.py